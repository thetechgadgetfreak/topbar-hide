name: Validate Extension

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell
      - name: Compile GSettings schema
        run: glib-compile-schemas schemas
